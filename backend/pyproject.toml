[project]
name = "fleeting"
version = "0.1.0"
description = "Local-first capture & memory inbox: voice, links and thoughts in — structured notes out."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "faster-whisper>=1.1",
    "psutil>=7.0",
    "watchdog>=4.0",
    "pyyaml>=6.0",
    "evdev>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "anyio>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fleeting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
