[project]
name = "fleeting"
version = "0.1.0"
description = "Local-first capture & memory inbox: voice, links and thoughts in — structured notes out."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "faster-whisper>=1.1",
    "psutil>=7.0",
    "watchdog>=4.0",
    "pyyaml>=6.0",
    "evdev>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "anyio>=4.6",
    # #191/#193: the linter CI and pre-commit run.
    "ruff>=0.14",
    # In the dev group rather than assumed globally, so `uv run pre-commit
    # install` works on a fresh clone with nothing else set up.
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fleeting"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# #191/#193. A deliberately small rule set: real defects (undefined names,
# duplicate dict keys, unused imports) rather than formatting. E501 is not
# selected on purpose — 229 lines already exceed 100 characters, so enabling
# it would mean reformatting the codebase before the linter had earned
# anything, and line length is the formatter's business, not the linter's.
# E741 is ignored because `l` for a loop item reads fine here and renaming it
# is churn rather than a fix.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]

