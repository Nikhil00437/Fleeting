# #191 CI. Every gate the project actually has, in one workflow.
#
# Deliberately not more than this. There is no eslint: `tsc -b` already runs
# with `strict`, `noUnusedLocals` and `noUnusedParameters`, and a second
# type-aware linter over the same files buys duplication, not signal. Adding it
# later is one line here plus one config file.
#
# `ruff check` runs before pytest rather than alongside it. A lint failure is
# the fast answer, and there is no point spending two minutes on a suite that
# is going to fail anyway.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# A superseded run is not worth finishing: cancel it and spend the minutes on
# the commit that is actually current.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      # pyproject.toml is in backend/, not the repo root. Without
      # working-directory these run at the root and uv fails immediately with
      # "No pyproject.toml found" — which is exactly what happened the first
      # time this workflow was written, and only surfaced by running it.
      - name: Sync
        working-directory: backend
        run: uv sync --all-groups
      # Lint first: it is the fast failure, and the expensive suite is
      # pointless once something is known to be wrong.
      - name: Lint
        working-directory: backend
        run: uv run ruff check .
      - name: Test
        working-directory: backend
        run: uv run pytest -q

  # #192. Not a generated client — api.ts is already typed with no `any` — but
  # nothing else notices when a route the frontend calls has been renamed.
  # Runs against the OpenAPI schema the app publishes, so no server is started.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      # The project environment lives in backend/, but this job runs from the
      # root because that is where scripts/ is. --project points uv at the
      # right one without changing directory.
      - name: Sync
        run: uv sync --project backend --all-groups
      # --config because scripts/ sits outside backend/, where pyproject.toml
      # lives; without it ruff would silently fall back to its default rules
      # and check these files by a different standard than the rest.
      - name: Lint tooling
        run: uv run --project backend ruff check --config backend/pyproject.toml scripts/
      - name: Check frontend routes against the API
        run: uv run --project backend python scripts/check_api_contract.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        working-directory: frontend
        run: bun install --frozen-lockfile
      # tsc before vitest, same reason as ruff before pytest.
      - name: Type-check
        working-directory: frontend
        run: bunx tsc -b
      - name: Test
        working-directory: frontend
        run: bun run test
      # The build is a separate gate from type-checking: Vite can succeed on
      # code that will not deploy, and this is the only job that would notice.
      - name: Build
        working-directory: frontend
        run: bun run build
      # #190: a real browser against the real server and the seeded demo
      # database. Chromium only — the Electron window lifecycle is Electron's
      # to test, and its logic is covered by electron/lib.test.js instead.
      - name: Install browser
        working-directory: frontend
        run: bunx playwright install --with-deps chromium
      - name: End-to-end
        working-directory: frontend
        run: bunx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7